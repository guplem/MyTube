name: Deploy wrapper to GitHub Pages

# Publishes pages/ (the installable wrapper and the app icon) to
# https://triunitystudios.com/MyTube/ (guplem.github.io redirects to that custom
# domain). doGet reads the favicon from there.
# Requires Settings -> Pages -> Source: "GitHub Actions", and a public repo
# (or a paid plan for Pages on a private repo).

on:
  push:
    branches: [main]
    paths: [pages/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - id: deployment
        uses: actions/deploy-pages@v4
