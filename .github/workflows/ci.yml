name: CI

# Quality gate for every pull request targeting main, plus a check on direct
# pushes. This is the check that must pass before a PR can merge (see the
# Testing & development protocol in CLAUDE.md and adr/0006). Enforce it by
# marking "test" a required status check in the branch-protection rule for main.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
