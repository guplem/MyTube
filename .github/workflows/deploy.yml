name: Deploy to Apps Script

# Auto-deploys on every push to main. Requires three repository secrets:
#   CLASPRC_JSON  - contents of ~/.clasprc.json after `clasp login`
#   CLASP_JSON    - contents of the project .clasp.json (script id + rootDir)
#   DEPLOYMENT_ID - the web app deployment to update (see `clasp deployments`)

on:
  push:
    branches: [main]
  # Manual escape hatch: deploy the current `main` on demand from the Actions
  # tab. Needed because a merge performed by the auto-merge bot's default
  # GITHUB_TOKEN does not trigger the push event above; a real token (see
  # auto-merge.yml) restores automatic deploys, and this button covers the rest.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Never deploy a broken main: re-run the same gate as CI before pushing.
      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - name: Restore clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '%s' "$CLASP_JSON" > .clasp.json

      - name: Push and deploy
        env:
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          npx clasp push -f
          npx clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "CI ${GITHUB_SHA::7}"
