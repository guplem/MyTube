<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: dark;
      }
      /* Make the `hidden` attribute win over element rules that set `display`
         (e.g. the flex layouts on the chapters section, comments body and end
         card). Without this, class specificity beats the UA [hidden] rule and
         those boxes stay visible while empty. */
      [hidden] {
        display: none !important;
      }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        margin: 0;
        background: #0f0f0f;
        color: #f1f1f1;
      }
      .app-header {
        display: flex;
        align-items: center;
        gap: 1rem 1.5rem;
        flex-wrap: wrap;
        padding: 1rem 1.5rem;
        border-bottom: 1px solid #222;
      }
      .app-header h1 {
        margin: 0;
        font-size: 1.3rem;
      }
      .app-nav {
        display: flex;
        gap: 0.5rem;
        max-width: 100%;
        overflow-x: auto;
      }
      .app-nav button {
        background: none;
        border: none;
        color: #aaa;
        font: inherit;
        cursor: pointer;
        padding: 0.3rem 0.6rem;
        border-radius: 6px;
        flex: 0 0 auto;
        white-space: nowrap;
      }
      .app-nav button:hover {
        color: #fff;
      }
      .app-nav button.active {
        color: #fff;
        background: #272727;
      }
      .app-search {
        margin-left: auto;
        display: flex;
        gap: 0.4rem;
      }
      .app-search input {
        background: #1c1c1c;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        padding: 0.4rem 0.6rem;
        color: #f1f1f1;
        font: inherit;
        min-width: 0;
      }
      .app-search button {
        background: #272727;
        color: #f1f1f1;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        padding: 0.4rem 0.7rem;
        font: inherit;
        cursor: pointer;
      }
      .app-search button:hover {
        background: #333;
      }
      #app {
        padding: 1.5rem;
      }
      .muted {
        color: #aaa;
      }

      /* Feed */
      .video-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 1rem;
      }
      .video-card {
        position: relative;
        display: flex;
        flex-direction: column;
        background: #1c1c1c;
        border-radius: 8px;
        overflow: hidden;
      }
      .video-card-corner {
        position: absolute;
        top: 0.4rem;
        right: 0.4rem;
        z-index: 1;
        width: 1.8rem;
        height: 1.8rem;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        border: none;
        border-radius: 50%;
        font-size: 1rem;
        line-height: 1;
        cursor: pointer;
      }
      .video-card-corner:hover:not(:disabled) {
        background: rgba(0, 0, 0, 0.9);
      }
      .video-card-corner:disabled {
        cursor: default;
      }
      .video-card--seen {
        opacity: 0.55;
      }
      .video-card--dismissed {
        opacity: 0.4;
      }

      /* Loading placeholders (skeletons) shown while a list/page loads. */
      .video-card--skeleton {
        pointer-events: none;
      }
      .skeleton-thumb {
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #2a2a2a;
      }
      .video-meta .skeleton-line {
        height: 0.8rem;
        border-radius: 4px;
        background: #2a2a2a;
      }
      .skeleton-line--short {
        width: 55%;
      }
      .playlist-item--skeleton {
        height: 1.2rem;
        pointer-events: none;
      }
      .video-card--skeleton .skeleton-thumb,
      .video-card--skeleton .skeleton-line,
      .playlist-item--skeleton {
        animation: skeleton-pulse 1.2s ease-in-out infinite;
      }
      @keyframes skeleton-pulse {
        0%,
        100% {
          opacity: 0.4;
        }
        50% {
          opacity: 0.8;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .video-card--skeleton .skeleton-thumb,
        .video-card--skeleton .skeleton-line,
        .playlist-item--skeleton {
          animation: none;
        }
      }
      .video-play {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        text-align: left;
        background: none;
        border: none;
        padding: 0;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .video-play:hover {
        background: #272727;
      }
      .video-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        padding: 0 0.7rem 0.7rem;
        /* Stick the buttons to the bottom of the card, even when titles differ
           in length and the grid stretches cards to equal height. */
        margin-top: auto;
      }
      .video-action {
        flex: 1 1 auto;
        min-width: 3.5rem;
        text-align: center;
        white-space: nowrap;
        background: #272727;
        color: #f1f1f1;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        padding: 0.35rem 0.5rem;
        font: inherit;
        font-size: 0.8rem;
        cursor: pointer;
      }
      .video-action:hover:not(:disabled) {
        background: #333;
      }
      .video-action:disabled {
        opacity: 0.6;
        cursor: default;
      }

      /* Playlists list */
      .playlist-list {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        max-width: 600px;
      }
      .playlist-item {
        text-align: left;
        background: #1c1c1c;
        border: 1px solid #2a2a2a;
        border-radius: 8px;
        padding: 0.8rem 1rem;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .playlist-item:hover {
        background: #272727;
      }
      .video-thumb-wrap {
        position: relative;
      }
      .video-thumb {
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        display: block;
        background: #000;
      }
      .video-duration {
        position: absolute;
        right: 0.4rem;
        bottom: 0.4rem;
        background: rgba(0, 0, 0, 0.8);
        color: #fff;
        font-size: 0.75rem;
        line-height: 1;
        padding: 0.15rem 0.3rem;
        border-radius: 4px;
        font-variant-numeric: tabular-nums;
      }
      .video-meta {
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
        padding: 0.6rem 0.7rem 0.8rem;
      }
      .video-title {
        font-weight: 600;
        line-height: 1.25;
      }
      .video-channel {
        color: #bbb;
        font-size: 0.85rem;
      }
      .video-date {
        color: #888;
        font-size: 0.8rem;
      }

      /* List pagination controls */
      .list-controls {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        flex-wrap: wrap;
        margin-top: 1rem;
      }
      .list-info {
        color: #aaa;
      }
      .list-size {
        color: #aaa;
        display: flex;
        align-items: center;
        gap: 0.35rem;
        margin-left: auto;
      }
      .list-controls button,
      .list-size select {
        background: #272727;
        color: #f1f1f1;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        padding: 0.4rem 0.7rem;
        font: inherit;
        cursor: pointer;
      }
      .list-controls button:hover:not(:disabled) {
        background: #333;
      }
      .list-controls button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .feed-toolbar {
        display: flex;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
        margin-bottom: 1rem;
      }
      .feed-toggle {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        color: #ccc;
        cursor: pointer;
      }
      .feed-toggle input {
        cursor: pointer;
      }
      .feed-filters {
        display: flex;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
      }
      .feed-date,
      .sort-select {
        background: #1c1c1c;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        padding: 0.25rem 0.4rem;
        color: #f1f1f1;
        font: inherit;
      }
      .refresh-button {
        background: #272727;
        color: #f1f1f1;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        padding: 0.4rem 0.8rem;
        font: inherit;
        cursor: pointer;
      }
      .refresh-button:hover {
        background: #333;
      }
      .refresh-button--right {
        margin-left: auto;
      }
      .feed-notice {
        margin-bottom: 1rem;
        padding: 0.6rem 0.8rem;
        border-radius: 6px;
        background: #3a2e1c;
        border: 1px solid #6b5320;
        color: #f3d9a0;
        font-size: 0.9rem;
        line-height: 1.4;
      }

      /* Toast notifications (shown when an optimistic action is rolled back) */
      .toast-container {
        position: fixed;
        left: 50%;
        bottom: 1.2rem;
        transform: translateX(-50%);
        z-index: 1000;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        width: max-content;
        max-width: calc(100vw - 2rem);
      }
      .toast {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        background: #3a1c1c;
        border: 1px solid #6b2020;
        color: #f3a0a0;
        border-radius: 8px;
        padding: 0.6rem 0.8rem;
        font-size: 0.9rem;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      }
      .toast-text {
        flex: 1;
      }
      .toast-refresh {
        flex-shrink: 0;
        background: #272727;
        color: #f1f1f1;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        padding: 0.3rem 0.6rem;
        font: inherit;
        font-size: 0.85rem;
        cursor: pointer;
      }
      .toast-refresh:hover {
        background: #333;
      }
      .toast-dismiss {
        flex-shrink: 0;
        background: none;
        border: none;
        color: inherit;
        font-size: 1rem;
        line-height: 1;
        padding: 0.1rem 0.2rem;
        cursor: pointer;
      }

      /* Player */
      .player-view {
        max-width: 900px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .player-title-row {
        display: flex;
        align-items: flex-start;
        gap: 1rem;
        flex-wrap: wrap;
      }
      .player-title-actions {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-shrink: 0;
      }
      .player-position {
        color: #bbb;
      }
      .player-autoplay {
        margin-left: auto;
        color: #bbb;
        display: flex;
        align-items: center;
        gap: 0.35rem;
        cursor: pointer;
      }
      .player-frame {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #000;
        border-radius: 8px;
        overflow: hidden;
      }
      .player-frame iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
      .player-title {
        margin: 0;
        font-size: 1.15rem;
        flex: 1;
        min-width: 0;
      }
      .player-nav {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        flex-wrap: wrap;
      }
      /* Prev/next stay grouped so they wrap together: both on the row or both
         on the next line, never one splitting off above the other. */
      .player-nav-buttons {
        display: flex;
        flex-wrap: nowrap;
        gap: 0.75rem;
      }
      /* Boxed sections (description, comments) so they read as distinct
         blocks. */
      .player-card {
        background: #1c1c1c;
        border: 1px solid #2a2a2a;
        border-radius: 8px;
        padding: 1rem;
      }
      .player-desc {
        margin: 0;
        white-space: pre-wrap;
        color: #ddd;
        line-height: 1.45;
      }
      .player-end-card {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        background: #1c1c1c;
        padding: 1rem;
        border-radius: 8px;
      }
      /* Header row: the "Comments" toggle on the left, the sort control
         right-aligned beside it. */
      .comments-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }
      .comments-toggle {
        background: none;
        border: none;
        padding: 0;
        font: inherit;
        font-size: 1rem;
        font-weight: 600;
        color: #ddd;
        cursor: pointer;
      }
      .comments-toggle:hover {
        color: #fff;
      }
      .comments-body {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        margin-top: 0.75rem;
      }
      .comments-sort {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        color: #aaa;
        flex-shrink: 0;
      }
      .player-comments {
        display: flex;
        flex-direction: column;
      }
      .comment {
        display: flex;
        gap: 0.7rem;
        padding: 0.75rem 0;
        border-bottom: 1px solid #222;
      }
      .comment-avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        flex-shrink: 0;
        background: #333;
        object-fit: cover;
      }
      .comment-body {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        min-width: 0;
      }
      .comment-head {
        display: flex;
        align-items: baseline;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      .comment-author {
        font-weight: 600;
        font-size: 0.85rem;
        color: #f1f1f1;
      }
      .comment-time {
        font-size: 0.75rem;
        color: #888;
      }
      .comment-text {
        white-space: pre-wrap;
        line-height: 1.45;
        overflow-wrap: anywhere;
      }
      .comment-meta {
        font-size: 0.8rem;
        color: #aaa;
      }
      .ts-link {
        appearance: none;
        -webkit-appearance: none;
        background: none;
        border: none;
        padding: 0;
        margin: 0;
        font: inherit;
        vertical-align: baseline;
        color: #3ea6ff;
        text-decoration: underline;
        cursor: pointer;
      }
      .ts-link:hover {
        color: #6cb8ff;
      }
      .show-more {
        align-self: flex-start;
        background: #272727;
        color: #f1f1f1;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        padding: 0.45rem 0.8rem;
        font: inherit;
        cursor: pointer;
      }
      .show-more:hover:not(:disabled) {
        background: #333;
      }
      .show-more:disabled {
        opacity: 0.5;
        cursor: default;
      }
      /* Box style for the player's action buttons. Excludes the link-like
         buttons (timestamps, comments toggle) and the chapter cards, which
         carry their own styling. */
      .player-view button:not(.ts-link):not(.comments-toggle):not(.chapter-card) {
        background: #272727;
        color: #f1f1f1;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        padding: 0.45rem 0.8rem;
        font: inherit;
        cursor: pointer;
      }
      .player-view button:not(.ts-link):not(.comments-toggle):not(.chapter-card):hover:not(:disabled) {
        background: #333;
      }
      .player-view button:not(.ts-link):not(.comments-toggle):not(.chapter-card):disabled {
        opacity: 0.4;
        cursor: default;
      }

      /* Description + chapters layout. On narrow screens they stack (chapters
         above the description, as a horizontal strip); on wide screens they sit
         side by side — description on the left, chapters as a vertically
         scrollable column on the right. See the min-width block below. */
      .player-info {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        align-items: stretch;
      }
      .player-info .player-desc-card {
        min-width: 0;
      }
      /* Narrow: keep the chapters strip above the description. */
      .player-info .player-chapters {
        order: -1;
      }

      /* Chapter strip: a horizontally scrollable row of the description's
         chapters, sitting between the video and the description. As the video
         plays the current chapter is highlighted, passed chapters dim, and the
         track auto-scrolls to keep the current one at the left. */
      .player-chapters {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }
      .player-chapters-heading {
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        color: #aaa;
      }
      .player-chapters-track {
        position: relative;
        display: flex;
        gap: 0.5rem;
        overflow-x: auto;
        padding-bottom: 0.35rem;
      }
      .player-view button.chapter-card {
        flex: 0 0 auto;
        max-width: 220px;
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
        text-align: left;
        background: #1c1c1c;
        border: 1px solid #2a2a2a;
        border-radius: 8px;
        padding: 0.5rem 0.7rem;
        font: inherit;
        cursor: pointer;
        transition: opacity 0.2s ease, background 0.2s ease, border-color 0.2s ease;
      }
      .player-view button.chapter-card:hover {
        background: #242424;
        border-color: #3a3a3a;
      }
      .chapter-time {
        font-size: 0.8rem;
        color: #3ea6ff;
        font-variant-numeric: tabular-nums;
      }
      .chapter-label {
        font-size: 0.85rem;
        color: #ddd;
        max-width: 200px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      /* Chapters already played read as muted. */
      .player-view button.chapter-card.past {
        opacity: 0.45;
      }
      /* The chapter playing now stands out from the rest. */
      .player-view button.chapter-card.current {
        opacity: 1;
        background: #23334a;
        border-color: #3ea6ff;
      }
      .player-view button.chapter-card.current:hover {
        background: #284066;
      }
      .player-view button.chapter-card.current .chapter-label {
        color: #fff;
      }
      /* The theater toggle is a compact icon button holding an inline SVG. */
      .player-view button.player-theater:not(.ts-link):not(.comments-toggle) {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0.4rem 0.55rem;
        font-size: 1.25rem;
        line-height: 1;
      }
      .player-theater svg {
        display: block;
      }
      /* Highlight the theater toggle while it is on. */
      .player-view button.player-theater.active,
      .player-view button.player-theater.active:hover {
        background: #3ea6ff;
        border-color: #3ea6ff;
        color: #0f0f0f;
      }

      /* Theater mode (desktop only): the player breaks out of the centered
         900px column and grows to 85% of the viewport — large like fullscreen
         but leaving room for the app header above and the player controls,
         which now sit just below the video. The page stays scrollable.
         left: 50% + translateX keeps the frame centered regardless of the
         column width (the player-view is centered via margin: 0 auto). */
      @media (min-width: 601px) {
        .player-view--theater .player-frame {
          position: relative;
          left: 50%;
          transform: translateX(-50%);
          width: 85vw;
          height: 85vh;
          aspect-ratio: auto;
        }
      }

      /* Wide screens: when the video has chapters, put the description on the
         left and the chapters as a fixed-width column on the right. Chapter-less
         videos keep the single full-width description.

         The whole section is capped to one height and each column scrolls its
         own content, so a long description no longer grows the page and creates
         a "double scroll" (page + chapters). align-items: stretch makes both
         columns the same height; max-height on the row caps that height and the
         inner overflow rules turn the excess into per-column scrolling. */
      @media (min-width: 800px) {
        .player-info--has-chapters {
          flex-direction: row;
          align-items: stretch;
          max-height: 460px;
        }
        .player-info--has-chapters .player-desc-card {
          flex: 1 1 auto;
          max-width: 560px;
          overflow-y: auto;
        }
        .player-info--has-chapters .player-chapters {
          order: 0;
          flex: 0 0 300px;
          max-width: 300px;
          min-height: 0;
        }
        .player-info--has-chapters .player-chapters-track {
          flex: 1 1 auto;
          flex-direction: column;
          overflow-x: hidden;
          overflow-y: auto;
          min-height: 0;
          padding-bottom: 0;
          padding-right: 0.35rem;
        }
        .player-view .player-info--has-chapters button.chapter-card {
          max-width: none;
        }
        .player-info--has-chapters .chapter-label {
          max-width: none;
        }
      }

      /* Mobile: stack the header, let the search fill the row, and pack the
         grid into smaller cards so two fit side by side on a phone. */
      @media (max-width: 600px) {
        .app-header {
          gap: 0.6rem 1rem;
          padding: 0.75rem 1rem;
        }
        .app-header h1 {
          font-size: 1.15rem;
        }
        /* Don't wrap the tabs onto a second line on a phone; let the row
           scroll horizontally when they don't all fit. */
        .app-nav {
          flex-wrap: nowrap;
        }
        .app-search {
          margin-left: 0;
          width: 100%;
        }
        .app-search input {
          flex: 1;
        }
        #app {
          padding: 0.75rem;
        }
        .video-list {
          grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
          gap: 0.6rem;
        }
        .video-title {
          font-size: 0.9rem;
        }
        .video-channel,
        .video-date {
          font-size: 0.75rem;
        }
        .list-size {
          margin-left: 0;
        }
        .player-autoplay {
          margin-left: 0;
        }
        /* The player is already full-width on a phone, so theater mode is a
           no-op there; hide the toggle to avoid clutter. The selector mirrors
           the base .player-view button.player-theater rule so it wins on
           specificity (a bare .player-theater would lose to it). */
        .player-view button.player-theater:not(.ts-link):not(.comments-toggle) {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="app-header">
      <nav class="app-nav">
