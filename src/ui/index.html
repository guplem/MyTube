<!doctype html>
<html>
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <!-- App icon (src/ui/icon.svg, inlined so it needs no hosting). Best-effort:
         the server can't use HtmlOutput.setFaviconUrl (it rejects data:/SVG), and
         the published app runs inside Google's outer iframe whose tab icon this
         <link> can't override, but it applies wherever the page is the top
         document (preview, direct HTML) and documents the app's icon. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%230f0f0f%22%2F%3E%3Crect%20x%3D%228%22%20y%3D%2215%22%20width%3D%2248%22%20height%3D%2234%22%20rx%3D%229%22%20fill%3D%22%23ff0033%22%2F%3E%3Cpath%20d%3D%22M27%2024%20L42%2032%20L27%2040%20Z%22%20fill%3D%22%23fff%22%2F%3E%3C%2Fsvg%3E"
    />
    <style>
      :root {
        color-scheme: dark;
      }
      /* Make the `hidden` attribute win over element rules that set `display`
         (e.g. the flex layouts on the chapters section, comments body and end
         card). Without this, class specificity beats the UA [hidden] rule and
         those boxes stay visible while empty. */
      [hidden] {
        display: none !important;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        margin: 0;
        background: #0f0f0f;
        color: #f1f1f1;
      }
      .app-header {
        display: flex;
        align-items: center;
        gap: 1rem 1.5rem;
        flex-wrap: wrap;
        padding: 1rem 1.5rem;
        border-bottom: 1px solid #222;
      }
      .app-header h1 {
        margin: 0;
        font-size: 1.3rem;
      }
      .app-nav {
        display: flex;
        gap: 0.5rem;
        max-width: 100%;
        overflow-x: auto;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .app-nav::-webkit-scrollbar {
        display: none;
      }
      .app-nav button {
        background: none;
        border: none;
        color: #aaa;
        font: inherit;
        cursor: pointer;
        padding: 0.3rem 0.6rem;
        border-radius: 6px;
        flex: 0 0 auto;
        white-space: nowrap;
      }
      .app-nav button:hover {
        color: #fff;
      }
      .app-nav button.active {
        color: #fff;
        background: #272727;
      }
      /* Feed button states, all driven by feedNavState in
         src/shared/feedNavState.ts. Dimmed until the session has loaded a feed
         page: the tab still works, the dim only warns that opening it may sit
         on skeletons. Not lower than 0.7: an inactive tab is #aaa on #0f0f0f,
         which composites to 4.6:1 here and 2.9:1 at 0.5 — below the 4.5:1 the
         label needs, and this is the landing screen of every cold session. */
      .app-nav button.nav-pending {
        opacity: 0.7;
      }
      /* While a first page is actually in flight, the same dim breathes instead
         of sitting still, so "not ready yet" reads as "still working" without
         adding anything that could change the button's size — opacity only, no
         border, no pseudo-element, no font change. Same 1.2s ease-in-out loop as
         the .skeleton blocks it is reporting on, so loading looks like one thing
         across the app. The floor stays at the 0.7 the contrast note above pins;
         only the bright half of the loop is new. */
      .app-nav button.nav-loading {
        animation: nav-loading-pulse 1.2s ease-in-out infinite;
      }
      @keyframes nav-loading-pulse {
        0%,
        100% {
          opacity: 0.7;
        }
        50% {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-nav button.nav-loading {
          animation: none;
          opacity: 0.7;
        }
      }
      /* A dot once the loaded page has videos waiting. Blue, the same
         chapter-strip blue as an ON card toggle — deliberately NOT the red
         .toggle-nudge dot, which asks for a tap; this one only reports. It sits
         over the button's own padding so the nav's horizontal scroll can never
         clip it. */
      .app-nav button.nav-waiting {
        position: relative;
      }
      .app-nav button.nav-waiting::after {
        content: "";
        position: absolute;
        top: 0.18rem;
        right: 0.2rem;
        width: 0.4rem;
        height: 0.4rem;
        border-radius: 50%;
        background: #3ea6ff;
      }
      .app-search {
        margin-left: auto;
        display: flex;
        gap: 0.4rem;
      }
      .app-search input {
        background: #1c1c1c;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        padding: 0.4rem 0.6rem;
        color: #f1f1f1;
        font: inherit;
        min-width: 0;
      }
      .app-search button {
        background: #272727;
        color: #f1f1f1;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        padding: 0.4rem 0.7rem;
        font: inherit;
        cursor: pointer;
      }
      .app-search button:hover {
        background: #333;
      }
      #app {
        padding: 1.5rem;
      }
      .muted {
        color: #aaa;
      }
      /* Deploy indicator at the very bottom of every screen: dimmer than
         .muted because it is chrome, not content. */
      .app-footer {
        padding: 1rem 1.5rem 1.25rem;
        text-align: center;
        font-size: 0.75rem;
        color: #666;
      }
      .app-footer a {
        color: inherit;
      }
      /* Footer lines sit side by side and wrap to the next row only when they
         do not fit, which puts each one on its own row on a phone. */
      .footer-line {
        display: inline-block;
        margin: 0 0.5rem;
      }
      /* The Settings entry is a button, not a link: the app is one page, so the
         click must reach the router (setupSettingsLink in src/ui/main.ts). It
         is painted as a link so the footer reads as one line of chrome. */
      .footer-link {
        background: none;
        border: none;
        padding: 0;
        font: inherit;
        color: inherit;
        text-decoration: underline;
        cursor: pointer;
      }
      .footer-link:hover {
        color: #f1f1f1;
      }

      /* Shared controls: the same inline label and the same field look on
         the feed toolbar, the sort toolbars and the Settings rows.
         .settings-select carries no rule of its own on purpose. It is the
         Settings screen's own hook, so a later tweak that one toolbar needs
         can change .sort-select alone and never reach the Settings picker. */
      .toggle-label {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        color: #ccc;
        cursor: pointer;
      }
      .toggle-label input {
        cursor: pointer;
      }
      .feed-date,
      .sort-select,
      .settings-select {
        background: #1c1c1c;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        padding: 0.25rem 0.4rem;
        color: #f1f1f1;
        font: inherit;
      }

      /* Settings */
      .settings {
        max-width: 34rem;
      }
      .settings-title {
        margin: 0 0 1rem;
        font-size: 1.3rem;
      }
      .settings-section {
        margin-bottom: 1.75rem;
      }
      .settings-heading {
        margin: 0 0 0.25rem;
        font-size: 1rem;
      }
      .settings-note {
        margin: 0 0 0.75rem;
        color: #aaa;
        font-size: 0.85rem;
        line-height: 1.4;
      }
      /* One setting per row: a settings list is read down the page, unlike the
         feed toolbar, whose toggles sit in one line. */
      .settings-row {
        padding: 0.4rem 0;
      }

      /* Feed */
      .video-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 1rem;
      }
      .video-card {
        position: relative;
        display: flex;
        flex-direction: column;
        background: #1c1c1c;
        border-radius: 8px;
        overflow: hidden;
      }
      .video-card-corner {
        position: absolute;
        top: 0.4rem;
        right: 0.4rem;
        z-index: 1;
        width: 1.8rem;
        height: 1.8rem;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        border: none;
        border-radius: 50%;
        font-size: 1rem;
        line-height: 1;
        cursor: pointer;
      }
      .video-card-corner:hover {
        background: rgba(0, 0, 0, 0.9);
      }
      .video-card--seen {
        opacity: 0.55;
      }
      .video-card--dismissed {
        opacity: 0.4;
      }
      /* A card whose Watch Later toggle now points at "gone from this list"
         (off on the Watch Later screen, on in the feed while "Hide saved" is
         on): it stays put but will disappear on the next load. */
      .video-card--removed {
        opacity: 0.4;
      }

      /* Loading placeholders (skeletons): grey pulsing blocks shaped and sized
         like the content they replace (built in src/ui/skeleton.ts), so the
         layout doesn't jump — or lose its scroll position — when data lands. */
      .skeleton {
        background: #2a2a2a;
        border-radius: 4px;
        animation: skeleton-pulse 1.2s ease-in-out infinite;
      }
      @keyframes skeleton-pulse {
        0%,
        100% {
          opacity: 0.4;
        }
        50% {
          opacity: 0.8;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .skeleton {
          animation: none;
          opacity: 0.5;
        }
      }
      .video-card--skeleton,
      .playlist-item--skeleton,
      .comment--skeleton {
        pointer-events: none;
      }
      .skeleton-thumb {
        width: 100%;
        aspect-ratio: 16 / 9;
        border-radius: 0;
      }
      /* Button-shaped block matching .video-action's rendered height (the
         column layout of .video-actions stretches it full-width). */
      .skeleton-action {
        height: 1.8rem;
        border-radius: 6px;
      }
      /* Text lines spaced like a paragraph (description, comment bodies). */
      .skeleton-paragraph {
        display: flex;
        flex-direction: column;
        gap: 0.55rem;
      }
      /* 16:9 stand-in for the video iframe while a shared link resolves. */
      .skeleton-player-frame {
        width: 100%;
        aspect-ratio: 16 / 9;
        border-radius: 8px;
      }
      .video-play {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        text-align: left;
        background: none;
        border: none;
        padding: 0;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .video-play:hover {
        background: #272727;
      }
      .video-actions {
        /* Always one full-width button per row: with a wrapping row, whether
           two buttons shared a line depended on their label widths, so cards
           on the same page laid out differently ("✓ Watched" fit,
           "Mark watched" didn't). A column keeps every card identical. */
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        padding: 0 0.7rem 0.7rem;
        /* Stick the buttons to the bottom of the card, even when titles differ
           in length and the grid stretches cards to equal height. */
        margin-top: auto;
      }
      .video-action {
        text-align: center;
        white-space: nowrap;
        background: #272727;
        color: #f1f1f1;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        padding: 0.35rem 0.5rem;
        font: inherit;
        font-size: 0.8rem;
        cursor: pointer;
      }
      .video-action:hover {
        background: #333;
      }
      /* A toggled-ON card button reads as pressed: filled with the same colors
         as the chapter strip's current chapter, so state scans at a glance.
         The label's leading ✓ carries the same state without color. Placed
         after .video-action:hover so the ON hover wins the tie. */
      .video-action--on {
        background: #23334a;
        border-color: #3ea6ff;
        color: #fff;
      }
      .video-action--on:hover {
        background: #284066;
      }
      /* Notification dot on the watched toggle when the progress store (or,
         in the player, live playback) says the video is effectively finished
         but it is not in the history yet — "you should probably tap this".
         Shared by the card buttons and the player's watched toggle. Red ties
         it to the thumbnail progress bar that prompted it; the dark ring
         lifts it off both the card and player backgrounds. */
      .toggle-nudge {
        position: relative;
      }
      .toggle-nudge::after {
        content: "";
        position: absolute;
        top: -0.22rem;
        right: -0.22rem;
        width: 0.55rem;
        height: 0.55rem;
        border-radius: 50%;
        background: #f03;
        box-shadow: 0 0 0 2px rgba(15, 15, 15, 0.85);
      }

      /* Playlists list */
      .playlist-list {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        max-width: 600px;
      }
      .playlist-item {
        text-align: left;
        background: #1c1c1c;
        border: 1px solid #2a2a2a;
        border-radius: 8px;
        padding: 0.8rem 1rem;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .playlist-item:hover {
        background: #272727;
      }
      .video-thumb-wrap {
        position: relative;
      }
      .video-thumb {
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        display: block;
        background: #000;
      }
      /* Watched-progress bar pinned to the bottom edge of the thumbnail, like
         YouTube's: a faint full-width track so the red fill reads as a fraction. */
      .video-progress {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 4px;
        background: rgba(255, 255, 255, 0.35);
      }
      .video-progress-fill {
        height: 100%;
        background: #f03;
      }
      .video-duration {
        position: absolute;
        right: 0.4rem;
        bottom: 0.4rem;
        background: rgba(0, 0, 0, 0.8);
        color: #fff;
        font-size: 0.75rem;
        line-height: 1;
        padding: 0.15rem 0.3rem;
        border-radius: 4px;
        font-variant-numeric: tabular-nums;
      }
      .video-meta {
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
        padding: 0.6rem 0.7rem 0.8rem;
      }
      .video-title {
        font-weight: 600;
        line-height: 1.25;
      }
      .video-channel {
        color: #bbb;
        font-size: 0.85rem;
      }
      .video-date {
        color: #888;
        font-size: 0.8rem;
      }

      /* List pagination controls */
      .list-controls {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        flex-wrap: wrap;
        margin-top: 1rem;
      }
      .list-info {
        color: #aaa;
      }
      .list-size {
        color: #aaa;
        display: flex;
        align-items: center;
        gap: 0.35rem;
        margin-left: auto;
      }
      .list-controls button,
      .list-size select {
        background: #272727;
        color: #f1f1f1;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        padding: 0.4rem 0.7rem;
        font: inherit;
        cursor: pointer;
      }
      .list-controls button:hover:not(:disabled) {
        background: #333;
      }
      .list-controls button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .feed-toolbar {
        display: flex;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
        margin-bottom: 1rem;
      }
      .feed-filters {
        display: flex;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
      }
      .refresh-button {
        background: #272727;
        color: #f1f1f1;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        padding: 0.4rem 0.8rem;
        font: inherit;
        cursor: pointer;
      }
      .refresh-button:hover {
        background: #333;
      }
      .refresh-button--right {
        margin-left: auto;
      }
      .feed-notice {
        margin-bottom: 1rem;
        padding: 0.6rem 0.8rem;
        border-radius: 6px;
        background: #3a2e1c;
        border: 1px solid #6b5320;
        color: #f3d9a0;
        font-size: 0.9rem;
        line-height: 1.4;
      }

      /* Toast notifications (shown when an optimistic action is rolled back) */
      .toast-container {
        position: fixed;
        left: 50%;
        bottom: 1.2rem;
        transform: translateX(-50%);
        z-index: 1000;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        width: max-content;
        max-width: calc(100vw - 2rem);
      }
      .toast {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        background: #3a1c1c;
        border: 1px solid #6b2020;
        color: #f3a0a0;
        border-radius: 8px;
        padding: 0.6rem 0.8rem;
        font-size: 0.9rem;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      }
      /* A toast that reports something that worked (the sponsor skip), not a
         failure: neutral chrome colours instead of the red failure palette. */
      .toast--notice {
        background: #272727;
        border-color: #3a3a3a;
        color: #f1f1f1;
      }
      .toast-text {
        flex: 1;
      }
      .toast-action {
        flex-shrink: 0;
        background: #272727;
        color: #f1f1f1;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        padding: 0.3rem 0.6rem;
        font: inherit;
        font-size: 0.85rem;
        cursor: pointer;
      }
      .toast-action:hover {
        background: #333;
      }
      .toast-dismiss {
        flex-shrink: 0;
        background: none;
        border: none;
        color: inherit;
        font-size: 1rem;
        line-height: 1;
        padding: 0.1rem 0.2rem;
        cursor: pointer;
      }

      /* Player */
      .player-view {
        max-width: 900px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .player-title-row {
        display: flex;
        align-items: flex-start;
        gap: 1rem;
        flex-wrap: wrap;
      }
      .player-title-actions {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-shrink: 0;
      }
      .player-position {
        color: #bbb;
      }
      .player-autoplay {
        margin-left: auto;
        color: #bbb;
        display: flex;
        align-items: center;
        gap: 0.35rem;
        cursor: pointer;
      }
      .player-frame {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #000;
        border-radius: 8px;
        overflow: hidden;
      }
      /* The rotor sits between the frame (the element the custom button
         fullscreens) and the YouTube iframe. Normally it just fills the
         frame; in portrait fullscreen on a touch screen it is rotated 90deg
         (below) to fake the landscape rotation the Apps Script sandbox
         blocks (no allow-orientation-lock token, so
         screen.orientation.lock() throws). It must be a child of the
         fullscreen element because the UA stylesheet forces
         "transform: none !important" on the fullscreen element itself. */
      .player-rotor {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      .player-frame iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
      .player-frame:fullscreen {
        border-radius: 0;
      }
      /* Fake landscape: lay the rotor out as a screen-sized landscape canvas
         (viewport units are the screen while fullscreen) rotated a quarter
         turn about the screen center. Scoped to portrait so that if the
         screen ever REALLY rotates (auto-rotate on, or Google adding the
         sandbox token making the lock work) this no longer matches and the
         real orientation takes over — never both. */
      @media (orientation: portrait) and (pointer: coarse) {
        .player-frame:fullscreen .player-rotor {
          top: 50%;
          left: 50%;
          width: 100vh;
          height: 100vw;
          transform: translate(-50%, -50%) rotate(90deg);
        }
      }
      /* Exit-fullscreen overlay: only exists while fullscreen. Lives inside
         the rotor so it rotates WITH the video — its bottom-right therefore
         reads as the bottom-right of the landscape view the user sees, clear
         of the embedded player's controls that cluster at the top. The :not()
         chain mirrors the box-style button rule below so these win on
         specificity (see the theater toggle's rules for the same trick). */
      .player-view button.player-fs-exit {
        display: none;
      }
      .player-view
        .player-frame:fullscreen
        button.player-fs-exit:not(.ts-link):not(.player-tab):not(
          .chapter-card
        ) {
        display: flex;
        align-items: center;
        justify-content: center;
        position: absolute;
        bottom: 0.75rem;
        right: 0.75rem;
        z-index: 2;
        padding: 0.5rem;
        font-size: 1.4rem;
        line-height: 1;
        color: #fff;
        background: rgba(0, 0, 0, 0.55);
        border: 0;
        border-radius: 50%;
      }
      .player-fs-exit svg {
        display: block;
      }
      .player-title {
        margin: 0;
        font-size: 1.15rem;
        flex: 1;
        min-width: 0;
      }
      .player-nav {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        flex-wrap: wrap;
      }
      /* Prev/next stay grouped so they wrap together: both on the row or both
         on the next line, never one splitting off above the other. */
      .player-nav-buttons {
        display: flex;
        flex-wrap: nowrap;
        gap: 0.75rem;
      }
      /* Boxed sections (description, comments) so they read as distinct
         blocks. */
      .player-card {
        background: #1c1c1c;
        border: 1px solid #2a2a2a;
        border-radius: 8px;
        padding: 1rem;
      }
      .player-desc {
        margin: 0;
        white-space: pre-wrap;
        /* pre-wrap only breaks at whitespace, so long unbroken strings (URLs,
           hashes) overflow the card. overflow-wrap breaks them at any point as
           a last resort; min-width:0 lets the paragraph shrink inside flex/grid
           parents instead of forcing the box wider. */
        overflow-wrap: anywhere;
        min-width: 0;
        color: #ddd;
        line-height: 1.45;
      }
      .player-end-card {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        background: #1c1c1c;
        padding: 1rem;
        border-radius: 8px;
      }
      /* Tab strip: the "Description" / "Comments" tabs above the panel, styled
         as an underlined segmented control. Only the selected panel shows. */
      .player-tab-strip {
        display: flex;
        gap: 0.25rem;
        border-bottom: 1px solid #2a2a2a;
      }
      .player-view button.player-tab {
        background: none;
        border: none;
        border-bottom: 2px solid transparent;
        border-radius: 0;
        margin-bottom: -1px;
        padding: 0.5rem 0.9rem;
        font: inherit;
        font-size: 1rem;
        font-weight: 600;
        color: #aaa;
        cursor: pointer;
      }
      .player-view button.player-tab:hover {
        background: none;
