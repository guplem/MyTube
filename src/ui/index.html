<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        margin: 0;
        background: #0f0f0f;
        color: #f1f1f1;
      }
      .app-header {
        padding: 1rem 1.5rem;
        border-bottom: 1px solid #222;
      }
      .app-header h1 {
        margin: 0;
        font-size: 1.3rem;
      }
      #app {
        padding: 1.5rem;
      }
      .muted {
        color: #aaa;
      }

      /* Feed */
      .video-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 1rem;
      }
      .video-card {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        text-align: left;
        background: #1c1c1c;
        border: none;
        border-radius: 8px;
        padding: 0;
        overflow: hidden;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .video-card:hover {
        background: #272727;
      }
      .video-card--seen {
        opacity: 0.55;
      }
      .video-thumb {
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        display: block;
        background: #000;
      }
      .video-meta {
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
        padding: 0.6rem 0.7rem 0.8rem;
      }
      .video-title {
        font-weight: 600;
        line-height: 1.25;
      }
      .video-channel {
        color: #bbb;
        font-size: 0.85rem;
      }
      .video-date {
        color: #888;
        font-size: 0.8rem;
      }

      /* Player */
      .player-view {
        max-width: 900px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .player-bar {
        display: flex;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
      }
      .player-position {
        color: #bbb;
      }
      .player-autoplay {
        margin-left: auto;
        color: #bbb;
        display: flex;
        align-items: center;
        gap: 0.35rem;
        cursor: pointer;
      }
      .player-frame {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #000;
        border-radius: 8px;
        overflow: hidden;
      }
      .player-frame iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
      .player-title {
        margin: 0;
        font-size: 1.15rem;
      }
      .player-nav {
        display: flex;
        gap: 0.5rem;
      }
      .player-desc {
        white-space: pre-wrap;
        color: #ddd;
        line-height: 1.45;
      }
      .player-end-card {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        background: #1c1c1c;
        padding: 1rem;
        border-radius: 8px;
      }
      .player-view button {
        background: #272727;
        color: #f1f1f1;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        padding: 0.45rem 0.8rem;
        font: inherit;
        cursor: pointer;
      }
      .player-view button:hover:not(:disabled) {
        background: #333;
      }
      .player-view button:disabled {
        opacity: 0.4;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <header class="app-header"><h1>MyTube</h1></header>
    <main id="app" class="muted">Loading…</main>

    <!-- Browser TypeScript bundle (built from src/ui by esbuild). -->
    <?!= include('ui'); ?>
  </body>
</html>
