<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <!-- App icon (src/ui/icon.svg, inlined so it needs no hosting). Best-effort:
         the server can't use HtmlOutput.setFaviconUrl (it rejects data:/SVG), and
         the published app runs inside Google's outer iframe whose tab icon this
         <link> can't override, but it applies wherever the page is the top
         document (preview, direct HTML) and documents the app's icon. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%230f0f0f%22%2F%3E%3Crect%20x%3D%228%22%20y%3D%2215%22%20width%3D%2248%22%20height%3D%2234%22%20rx%3D%229%22%20fill%3D%22%23ff0033%22%2F%3E%3Cpath%20d%3D%22M27%2024%20L42%2032%20L27%2040%20Z%22%20fill%3D%22%23fff%22%2F%3E%3C%2Fsvg%3E"
    />
    <style>
      :root {
        color-scheme: dark;
      }
      /* Make the `hidden` attribute win over element rules that set `display`
         (e.g. the flex layouts on the chapters section, comments body and end
         card). Without this, class specificity beats the UA [hidden] rule and
         those boxes stay visible while empty. */
      [hidden] {
        display: none !important;
      }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        margin: 0;
        background: #0f0f0f;
        color: #f1f1f1;
      }
      .app-header {
        display: flex;
        align-items: center;
        gap: 1rem 1.5rem;
        flex-wrap: wrap;
        padding: 1rem 1.5rem;
        border-bottom: 1px solid #222;
      }
      .app-header h1 {
        margin: 0;
        font-size: 1.3rem;
      }
      .app-nav {
        display: flex;
        gap: 0.5rem;
        max-width: 100%;
        overflow-x: auto;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .app-nav::-webkit-scrollbar {
        display: none;
      }
      .app-nav button {
        background: none;
        border: none;
        color: #aaa;
        font: inherit;
        cursor: pointer;
        padding: 0.3rem 0.6rem;
        border-radius: 6px;
        flex: 0 0 auto;
        white-space: nowrap;
      }
      .app-nav button:hover {
        color: #fff;
      }
      .app-nav button.active {
        color: #fff;
        background: #272727;
      }
      .app-search {
        margin-left: auto;
        display: flex;
        gap: 0.4rem;
      }
      .app-search input {
        background: #1c1c1c;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        padding: 0.4rem 0.6rem;
        color: #f1f1f1;
        font: inherit;
        min-width: 0;
      }
      .app-search button {
        background: #272727;
        color: #f1f1f1;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        padding: 0.4rem 0.7rem;
        font: inherit;
        cursor: pointer;
      }
      .app-search button:hover {
        background: #333;
      }
      #app {
        padding: 1.5rem;
      }
      .muted {
        color: #aaa;
      }

      /* Feed */
      .video-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 1rem;
      }
      .video-card {
        position: relative;
        display: flex;
        flex-direction: column;
        background: #1c1c1c;
        border-radius: 8px;
        overflow: hidden;
      }
      .video-card-corner {
        position: absolute;
        top: 0.4rem;
        right: 0.4rem;
        z-index: 1;
        width: 1.8rem;
        height: 1.8rem;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        border: none;
        border-radius: 50%;
        font-size: 1rem;
        line-height: 1;
        cursor: pointer;
      }
      .video-card-corner:hover:not(:disabled) {
        background: rgba(0, 0, 0, 0.9);
      }
      .video-card-corner:disabled {
        cursor: default;
      }
      .video-card--seen {
        opacity: 0.55;
      }
      .video-card--dismissed {
        opacity: 0.4;
      }
      /* Watch Later: a card whose membership toggle is off (it will disappear
         on the next load). */
      .video-card--removed {
        opacity: 0.4;
      }

      /* Loading placeholders (skeletons): grey pulsing blocks shaped and sized
         like the content they replace (built in src/ui/skeleton.ts), so the
         layout doesn't jump — or lose its scroll position — when data lands. */
      .skeleton {
        background: #2a2a2a;
        border-radius: 4px;
        animation: skeleton-pulse 1.2s ease-in-out infinite;
      }
      @keyframes skeleton-pulse {
        0%,
        100% {
          opacity: 0.4;
        }
        50% {
          opacity: 0.8;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .skeleton {
          animation: none;
          opacity: 0.5;
        }
      }
      .video-card--skeleton,
      .playlist-item--skeleton,
      .comment--skeleton {
        pointer-events: none;
      }
      .skeleton-thumb {
        width: 100%;
        aspect-ratio: 16 / 9;
        border-radius: 0;
      }
      /* Button-shaped block matching .video-action's rendered height (the
         column layout of .video-actions stretches it full-width). */
      .skeleton-action {
        height: 1.8rem;
        border-radius: 6px;
      }
      /* Text lines spaced like a paragraph (description, comment bodies). */
      .skeleton-paragraph {
        display: flex;
        flex-direction: column;
        gap: 0.55rem;
      }
      /* 16:9 stand-in for the video iframe while a shared link resolves. */
      .skeleton-player-frame {
        width: 100%;
        aspect-ratio: 16 / 9;
        border-radius: 8px;
      }
      .video-play {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        text-align: left;
        background: none;
        border: none;
        padding: 0;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .video-play:hover {
        background: #272727;
      }
      .video-actions {
        /* Always one full-width button per row: with a wrapping row, whether
           two buttons shared a line depended on their label widths, so cards
           on the same page laid out differently ("Seen ✓" fit, "Mark seen"
           didn't). A column keeps every card identical. */
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        padding: 0 0.7rem 0.7rem;
        /* Stick the buttons to the bottom of the card, even when titles differ
           in length and the grid stretches cards to equal height. */
        margin-top: auto;
      }
      .video-action {
        text-align: center;
        white-space: nowrap;
        background: #272727;
        color: #f1f1f1;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        padding: 0.35rem 0.5rem;
        font: inherit;
        font-size: 0.8rem;
        cursor: pointer;
      }
      .video-action:hover {
        background: #333;
      }

      /* Playlists list */
      .playlist-list {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        max-width: 600px;
      }
      .playlist-item {
        text-align: left;
        background: #1c1c1c;
        border: 1px solid #2a2a2a;
        border-radius: 8px;
        padding: 0.8rem 1rem;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .playlist-item:hover {
        background: #272727;
      }
      .video-thumb-wrap {
        position: relative;
      }
      .video-thumb {
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        display: block;
        background: #000;
      }
      /* Watched-progress bar pinned to the bottom edge of the thumbnail, like
         YouTube's: a faint full-width track so the red fill reads as a fraction. */
      .video-progress {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 4px;
        background: rgba(255, 255, 255, 0.35);
      }
      .video-progress-fill {
        height: 100%;
        background: #f03;
      }
      .video-duration {
        position: absolute;
        right: 0.4rem;
        bottom: 0.4rem;
        background: rgba(0, 0, 0, 0.8);
        color: #fff;
        font-size: 0.75rem;
        line-height: 1;
        padding: 0.15rem 0.3rem;
        border-radius: 4px;
        font-variant-numeric: tabular-nums;
      }
      .video-meta {
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
        padding: 0.6rem 0.7rem 0.8rem;
      }
      .video-title {
        font-weight: 600;
        line-height: 1.25;
      }
      .video-channel {
        color: #bbb;
        font-size: 0.85rem;
      }
      .video-date {
        color: #888;
        font-size: 0.8rem;
      }

      /* List pagination controls */
      .list-controls {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        flex-wrap: wrap;
        margin-top: 1rem;
      }
      .list-info {
        color: #aaa;
      }
      .list-size {
        color: #aaa;
        display: flex;
        align-items: center;
        gap: 0.35rem;
        margin-left: auto;
      }
      .list-controls button,
      .list-size select {
        background: #272727;
        color: #f1f1f1;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        padding: 0.4rem 0.7rem;
        font: inherit;
        cursor: pointer;
      }
      .list-controls button:hover:not(:disabled) {
        background: #333;
      }
      .list-controls button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .feed-toolbar {
        display: flex;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
        margin-bottom: 1rem;
      }
      .feed-toggle {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        color: #ccc;
        cursor: pointer;
      }
      .feed-toggle input {
        cursor: pointer;
      }
      .feed-filters {
        display: flex;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
      }
      .feed-date,
      .sort-select {
        background: #1c1c1c;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        padding: 0.25rem 0.4rem;
        color: #f1f1f1;
        font: inherit;
      }
      .refresh-button {
        background: #272727;
        color: #f1f1f1;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        padding: 0.4rem 0.8rem;
        font: inherit;
        cursor: pointer;
      }
      .refresh-button:hover {
        background: #333;
      }
      .refresh-button--right {
        margin-left: auto;
      }
      .feed-notice {
        margin-bottom: 1rem;
        padding: 0.6rem 0.8rem;
        border-radius: 6px;
        background: #3a2e1c;
        border: 1px solid #6b5320;
        color: #f3d9a0;
        font-size: 0.9rem;
        line-height: 1.4;
      }

      /* Toast notifications (shown when an optimistic action is rolled back) */
      .toast-container {
        position: fixed;
        left: 50%;
        bottom: 1.2rem;
        transform: translateX(-50%);
        z-index: 1000;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        width: max-content;
        max-width: calc(100vw - 2rem);
      }
      .toast {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        background: #3a1c1c;
        border: 1px solid #6b2020;
        color: #f3a0a0;
        border-radius: 8px;
        padding: 0.6rem 0.8rem;
        font-size: 0.9rem;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      }
      .toast-text {
        flex: 1;
      }
      .toast-refresh {
        flex-shrink: 0;
        background: #272727;
        color: #f1f1f1;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        padding: 0.3rem 0.6rem;
        font: inherit;
        font-size: 0.85rem;
        cursor: pointer;
      }
      .toast-refresh:hover {
        background: #333;
      }
      .toast-dismiss {
        flex-shrink: 0;
        background: none;
        border: none;
        color: inherit;
        font-size: 1rem;
        line-height: 1;
        padding: 0.1rem 0.2rem;
        cursor: pointer;
      }

      /* Player */
      .player-view {
        max-width: 900px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .player-title-row {
        display: flex;
        align-items: flex-start;
        gap: 1rem;
        flex-wrap: wrap;
      }
      .player-title-actions {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-shrink: 0;
      }
      .player-position {
        color: #bbb;
      }
      .player-autoplay {
        margin-left: auto;
        color: #bbb;
        display: flex;
        align-items: center;
        gap: 0.35rem;
        cursor: pointer;
      }
      .player-frame {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #000;
        border-radius: 8px;
        overflow: hidden;
      }
      .player-frame iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
      .player-title {
        margin: 0;
        font-size: 1.15rem;
        flex: 1;
        min-width: 0;
      }
      .player-nav {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        flex-wrap: wrap;
      }
      /* Prev/next stay grouped so they wrap together: both on the row or both
         on the next line, never one splitting off above the other. */
      .player-nav-buttons {
        display: flex;
        flex-wrap: nowrap;
        gap: 0.75rem;
      }
      /* Boxed sections (description, comments) so they read as distinct
         blocks. */
      .player-card {
        background: #1c1c1c;
        border: 1px solid #2a2a2a;
        border-radius: 8px;
        padding: 1rem;
      }
      .player-desc {
        margin: 0;
        white-space: pre-wrap;
        /* pre-wrap only breaks at whitespace, so long unbroken strings (URLs,
           hashes) overflow the card. overflow-wrap breaks them at any point as
           a last resort; min-width:0 lets the paragraph shrink inside flex/grid
           parents instead of forcing the box wider. */
        overflow-wrap: anywhere;
        min-width: 0;
        color: #ddd;
        line-height: 1.45;
      }
      .player-end-card {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        background: #1c1c1c;
        padding: 1rem;
        border-radius: 8px;
      }
      /* Tab strip: the "Description" / "Comments" tabs above the panel, styled
         as an underlined segmented control. Only the selected panel shows. */
      .player-tab-strip {
        display: flex;
        gap: 0.25rem;
        border-bottom: 1px solid #2a2a2a;
      }
      .player-view button.player-tab {
        background: none;
        border: none;
        border-bottom: 2px solid transparent;
        border-radius: 0;
        margin-bottom: -1px;
        padding: 0.5rem 0.9rem;
        font: inherit;
        font-size: 1rem;
        font-weight: 600;
        color: #aaa;
        cursor: pointer;
      }
      .player-view button.player-tab:hover {
        background: none;
        color: #ddd;
      }
      .player-view button.player-tab[aria-selected="true"] {
        color: #fff;
        border-bottom-color: #3ea6ff;
      }
      /* The comments panel lays its controls, list, and "show more" in a column. */
      .player-tab-panel.comments-card {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      /* The sort control is the comments panel's own contents, left-aligned. */
      .comments-controls {
        display: flex;
        justify-content: flex-start;
      }
      .comments-sort {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        color: #aaa;
        flex-shrink: 0;
      }
      .player-comments {
        display: flex;
        flex-direction: column;
      }
      .comment {
        display: flex;
        gap: 0.7rem;
        padding: 0.75rem 0;
        border-bottom: 1px solid #222;
      }
      .comment-avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        flex-shrink: 0;
        background: #333;
        object-fit: cover;
      }
      .comment-body {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        min-width: 0;
      }
      .comment-head {
        display: flex;
        align-items: baseline;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      .comment-author {
        font-weight: 600;
        font-size: 0.85rem;
        color: #f1f1f1;
      }
      .comment-time {
        font-size: 0.75rem;
        color: #888;
      }
      .comment-text {
        white-space: pre-wrap;
        line-height: 1.45;
        overflow-wrap: anywhere;
      }
      .comment-meta {
        font-size: 0.8rem;
        color: #aaa;
      }
      .ts-link {
        appearance: none;
        -webkit-appearance: none;
        background: none;
        border: none;
        padding: 0;
        margin: 0;
        font: inherit;
        vertical-align: baseline;
        color: #3ea6ff;
        text-decoration: underline;
        cursor: pointer;
      }
      .ts-link:hover {
        color: #6cb8ff;
      }
      .show-more {
        align-self: flex-start;
        background: #272727;
        color: #f1f1f1;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        padding: 0.45rem 0.8rem;
        font: inherit;
        cursor: pointer;
      }
      .show-more:hover:not(:disabled) {
        background: #333;
      }
      .show-more:disabled {
        opacity: 0.5;
        cursor: default;
      }
      /* Box style for the player's action buttons. Excludes the link-like
         buttons (timestamps, comments toggle) and the chapter cards, which
         carry their own styling. */
      .player-view button:not(.ts-link):not(.player-tab):not(.chapter-card) {
        background: #272727;
        color: #f1f1f1;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        padding: 0.45rem 0.8rem;
        font: inherit;
        cursor: pointer;
      }
      .player-view button:not(.ts-link):not(.player-tab):not(.chapter-card):hover:not(:disabled) {
        background: #333;
      }
      .player-view button:not(.ts-link):not(.player-tab):not(.chapter-card):disabled {
        opacity: 0.4;
        cursor: default;
      }

      .player-desc-card {
        min-width: 0;
      }

      /* Chapter strip: a horizontally scrollable row of the description's
         chapters, sitting above the tabs. As the video plays the current
         chapter is highlighted, passed chapters dim, and the track auto-scrolls
         to keep the current one at the left. */
      .player-chapters {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }
      .player-chapters-heading {
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        color: #aaa;
      }
      .player-chapters-track {
        position: relative;
        display: flex;
        gap: 0.5rem;
        overflow-x: auto;
        padding-bottom: 0.35rem;
      }
      /* On touch devices the overlay scrollbar can appear on load and linger
         until the user scrolls, so hide it there (same pattern as .app-nav);
         swiping still scrolls. Mouse users keep the draggable scrollbar. */
      @media (hover: none) and (pointer: coarse) {
        .player-chapters-track {
          scrollbar-width: none;
          -ms-overflow-style: none;
        }
        .player-chapters-track::-webkit-scrollbar {
          display: none;
        }
      }
      .player-view button.chapter-card {
        flex: 0 0 auto;
        max-width: 220px;
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
        text-align: left;
        background: #1c1c1c;
        border: 1px solid #2a2a2a;
        border-radius: 8px;
        padding: 0.5rem 0.7rem;
        font: inherit;
        cursor: pointer;
        transition: opacity 0.2s ease, background 0.2s ease, border-color 0.2s ease;
      }
      .player-view button.chapter-card:hover {
        background: #242424;
        border-color: #3a3a3a;
      }
      .chapter-time {
        font-size: 0.8rem;
        color: #3ea6ff;
        font-variant-numeric: tabular-nums;
      }
      .chapter-label {
        font-size: 0.85rem;
        color: #ddd;
        max-width: 200px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      /* Chapters already played read as muted. */
      .player-view button.chapter-card.past {
        opacity: 0.45;
      }
      /* The chapter playing now stands out from the rest. */
      .player-view button.chapter-card.current {
        opacity: 1;
        background: #23334a;
        border-color: #3ea6ff;
      }
      .player-view button.chapter-card.current:hover {
        background: #284066;
      }
      .player-view button.chapter-card.current .chapter-label {
        color: #fff;
      }
      /* The theater toggle is a compact icon button holding an inline SVG. */
      .player-view button.player-theater:not(.ts-link):not(.player-tab) {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0.4rem 0.55rem;
        font-size: 1.25rem;
        line-height: 1;
      }
      .player-theater svg {
        display: block;
      }
      /* Highlight the theater toggle while it is on. */
      .player-view button.player-theater.active,
      .player-view button.player-theater.active:hover {
        background: #3ea6ff;
        border-color: #3ea6ff;
        color: #0f0f0f;
      }

      /* Theater mode (desktop only): the player breaks out of the centered
         900px column and grows to 85% of the viewport — large like fullscreen
         but leaving room for the app header above and the player controls,
         which now sit just below the video. The page stays scrollable.
         left: 50% + translateX keeps the frame centered regardless of the
         column width (the player-view is centered via margin: 0 auto). */
      @media (min-width: 601px) {
        .player-view--theater .player-frame {
          position: relative;
          left: 50%;
          transform: translateX(-50%);
          width: 85vw;
          height: 85vh;
          aspect-ratio: auto;
        }
      }

      /* Mobile: stack the header, let the search fill the row, and pack the
         grid into smaller cards so two fit side by side on a phone. */
      @media (max-width: 600px) {
