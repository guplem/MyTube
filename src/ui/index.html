<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        margin: 0;
        background: #0f0f0f;
        color: #f1f1f1;
      }
      .app-header {
        display: flex;
        align-items: center;
        gap: 1rem 1.5rem;
        flex-wrap: wrap;
        padding: 1rem 1.5rem;
        border-bottom: 1px solid #222;
      }
      .app-header h1 {
        margin: 0;
        font-size: 1.3rem;
      }
      .app-nav {
        display: flex;
        gap: 0.5rem;
      }
      .app-nav button {
        background: none;
        border: none;
        color: #aaa;
        font: inherit;
        cursor: pointer;
        padding: 0.3rem 0.6rem;
        border-radius: 6px;
      }
      .app-nav button:hover {
        color: #fff;
      }
      .app-nav button.active {
        color: #fff;
        background: #272727;
      }
      .app-search {
        margin-left: auto;
        display: flex;
        gap: 0.4rem;
      }
      .app-search input {
        background: #1c1c1c;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        padding: 0.4rem 0.6rem;
        color: #f1f1f1;
        font: inherit;
        min-width: 0;
      }
      .app-search button {
        background: #272727;
        color: #f1f1f1;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        padding: 0.4rem 0.7rem;
        font: inherit;
        cursor: pointer;
      }
      .app-search button:hover {
        background: #333;
      }
      #app {
        padding: 1.5rem;
      }
      .muted {
        color: #aaa;
      }

      /* Feed */
      .video-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 1rem;
      }
      .video-card {
        position: relative;
        display: flex;
        flex-direction: column;
        background: #1c1c1c;
        border-radius: 8px;
        overflow: hidden;
      }
      .video-card-corner {
        position: absolute;
        top: 0.4rem;
        right: 0.4rem;
        z-index: 1;
        width: 1.8rem;
        height: 1.8rem;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        border: none;
        border-radius: 50%;
        font-size: 1rem;
        line-height: 1;
        cursor: pointer;
      }
      .video-card-corner:hover:not(:disabled) {
        background: rgba(0, 0, 0, 0.9);
      }
      .video-card-corner:disabled {
        cursor: default;
      }
      .video-card--seen {
        opacity: 0.55;
      }
      .video-card--dismissed {
        opacity: 0.4;
      }

      /* Loading placeholders (skeletons) shown while a list/page loads. */
      .video-card--skeleton {
        pointer-events: none;
      }
      .skeleton-thumb {
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #2a2a2a;
      }
      .video-meta .skeleton-line {
        height: 0.8rem;
        border-radius: 4px;
        background: #2a2a2a;
      }
      .skeleton-line--short {
        width: 55%;
      }
      .playlist-item--skeleton {
        height: 1.2rem;
        pointer-events: none;
      }
      .video-card--skeleton .skeleton-thumb,
      .video-card--skeleton .skeleton-line,
      .playlist-item--skeleton {
        animation: skeleton-pulse 1.2s ease-in-out infinite;
      }
      @keyframes skeleton-pulse {
        0%,
        100% {
          opacity: 0.4;
        }
        50% {
          opacity: 0.8;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .video-card--skeleton .skeleton-thumb,
        .video-card--skeleton .skeleton-line,
        .playlist-item--skeleton {
          animation: none;
        }
      }
      .video-play {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        text-align: left;
        background: none;
        border: none;
        padding: 0;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .video-play:hover {
        background: #272727;
      }
      .video-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        padding: 0 0.7rem 0.7rem;
        /* Stick the buttons to the bottom of the card, even when titles differ
           in length and the grid stretches cards to equal height. */
        margin-top: auto;
      }
      .video-action {
        flex: 1 1 auto;
        min-width: 3.5rem;
        text-align: center;
        white-space: nowrap;
        background: #272727;
        color: #f1f1f1;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        padding: 0.35rem 0.5rem;
        font: inherit;
        font-size: 0.8rem;
        cursor: pointer;
      }
      .video-action:hover:not(:disabled) {
        background: #333;
      }
      .video-action:disabled {
        opacity: 0.6;
        cursor: default;
      }

      /* Playlists list */
      .playlist-list {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        max-width: 600px;
      }
      .playlist-item {
        text-align: left;
        background: #1c1c1c;
        border: 1px solid #2a2a2a;
        border-radius: 8px;
        padding: 0.8rem 1rem;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .playlist-item:hover {
        background: #272727;
      }
      .video-thumb-wrap {
        position: relative;
      }
      .video-thumb {
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        display: block;
        background: #000;
      }
      .video-duration {
        position: absolute;
        right: 0.4rem;
        bottom: 0.4rem;
        background: rgba(0, 0, 0, 0.8);
        color: #fff;
        font-size: 0.75rem;
        line-height: 1;
        padding: 0.15rem 0.3rem;
        border-radius: 4px;
        font-variant-numeric: tabular-nums;
      }
      .video-meta {
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
        padding: 0.6rem 0.7rem 0.8rem;
      }
      .video-title {
        font-weight: 600;
        line-height: 1.25;
      }
      .video-channel {
        color: #bbb;
        font-size: 0.85rem;
      }
      .video-date {
        color: #888;
        font-size: 0.8rem;
      }

      /* List pagination controls */
      .list-controls {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        flex-wrap: wrap;
        margin-top: 1rem;
      }
      .list-info {
        color: #aaa;
      }
      .list-size {
        color: #aaa;
        display: flex;
        align-items: center;
        gap: 0.35rem;
        margin-left: auto;
      }
      .list-controls button,
      .list-size select {
        background: #272727;
        color: #f1f1f1;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        padding: 0.4rem 0.7rem;
        font: inherit;
        cursor: pointer;
      }
      .list-controls button:hover:not(:disabled) {
        background: #333;
      }
      .list-controls button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .feed-toolbar {
        display: flex;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
        margin-bottom: 1rem;
      }
      .feed-toggle {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        color: #ccc;
        cursor: pointer;
      }
      .feed-toggle input {
        cursor: pointer;
      }
      .feed-filters {
        display: flex;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
      }
      .feed-date,
      .sort-select {
        background: #1c1c1c;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        padding: 0.25rem 0.4rem;
        color: #f1f1f1;
        font: inherit;
      }
      .refresh-button {
        background: #272727;
        color: #f1f1f1;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        padding: 0.4rem 0.8rem;
        font: inherit;
        cursor: pointer;
      }
      .refresh-button:hover {
        background: #333;
      }
      .refresh-button--right {
        margin-left: auto;
      }

      /* Player */
      .player-view {
        max-width: 900px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .player-bar {
        display: flex;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
      }
      .player-position {
        color: #bbb;
      }
      .player-autoplay {
        margin-left: auto;
        color: #bbb;
        display: flex;
        align-items: center;
        gap: 0.35rem;
        cursor: pointer;
      }
      .player-frame {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #000;
        border-radius: 8px;
        overflow: hidden;
      }
      .player-frame iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
      .player-title {
        margin: 0;
        font-size: 1.15rem;
      }
      .player-nav {
        display: flex;
        gap: 0.5rem;
      }
      .player-desc {
        white-space: pre-wrap;
        color: #ddd;
        line-height: 1.45;
      }
      .player-end-card {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        background: #1c1c1c;
        padding: 1rem;
        border-radius: 8px;
      }
      .comments-toggle {
        align-self: flex-start;
        margin-top: 0.5rem;
        background: none;
        border: none;
        padding: 0.25rem 0;
        font: inherit;
        font-size: 1rem;
        font-weight: 600;
        color: #ddd;
        cursor: pointer;
      }
      .comments-toggle:hover {
        color: #fff;
      }
      .comments-body {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .comments-sort {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        color: #aaa;
      }
      .player-comments {
        display: flex;
        flex-direction: column;
      }
      .comment {
        display: flex;
        gap: 0.7rem;
        padding: 0.75rem 0;
        border-bottom: 1px solid #222;
      }
      .comment-avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        flex-shrink: 0;
        background: #333;
        object-fit: cover;
      }
      .comment-body {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        min-width: 0;
      }
      .comment-head {
        display: flex;
        align-items: baseline;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      .comment-author {
        font-weight: 600;
        font-size: 0.85rem;
        color: #f1f1f1;
      }
      .comment-time {
        font-size: 0.75rem;
        color: #888;
      }
      .comment-text {
        white-space: pre-wrap;
        line-height: 1.45;
        overflow-wrap: anywhere;
      }
      .comment-meta {
        font-size: 0.8rem;
        color: #aaa;
      }
      .ts-link {
        appearance: none;
        -webkit-appearance: none;
        background: none;
        border: none;
        padding: 0;
        margin: 0;
        font: inherit;
        vertical-align: baseline;
        color: #3ea6ff;
        text-decoration: underline;
        cursor: pointer;
      }
      .ts-link:hover {
        color: #6cb8ff;
      }
      .show-more {
        align-self: flex-start;
        background: #272727;
        color: #f1f1f1;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        padding: 0.45rem 0.8rem;
        font: inherit;
        cursor: pointer;
      }
      .show-more:hover:not(:disabled) {
        background: #333;
      }
      .show-more:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .player-view button {
        background: #272727;
        color: #f1f1f1;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        padding: 0.45rem 0.8rem;
        font: inherit;
        cursor: pointer;
      }
      .player-view button:hover:not(:disabled) {
        background: #333;
      }
      .player-view button:disabled {
        opacity: 0.4;
        cursor: default;
      }

      /* Mobile: stack the header, let the search fill the row, and pack the
         grid into smaller cards so two fit side by side on a phone. */
      @media (max-width: 600px) {
        .app-header {
          gap: 0.6rem 1rem;
          padding: 0.75rem 1rem;
        }
        .app-header h1 {
          font-size: 1.15rem;
        }
        .app-nav {
          flex-wrap: wrap;
        }
        .app-search {
          margin-left: 0;
          width: 100%;
        }
        .app-search input {
          flex: 1;
        }
        #app {
          padding: 0.75rem;
        }
        .video-list {
          grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
          gap: 0.6rem;
        }
        .video-title {
          font-size: 0.9rem;
        }
        .video-channel,
        .video-date {
          font-size: 0.75rem;
        }
        .list-size {
          margin-left: 0;
        }
        .player-bar {
          gap: 0.6rem;
        }
        .player-autoplay {
          margin-left: 0;
        }
      }
    </style>
  </head>
  <body>
    <header class="app-header">
      <nav class="app-nav">
        <button type="button" data-view="feed" class="active">Feed</button>
        <button type="button" data-view="watchlater">Watch Later</button>
        <button type="button" data-view="playlists">Playlists</button>
        <button type="button" data-view="history">History</button>
      </nav>
      <form class="app-search">
        <input type="search" placeholder="Search YouTube…" aria-label="Search YouTube" />
      </form>
    </header>
    <main id="app" class="muted">Loading…</main>

    <!-- Browser TypeScript bundle (built from src/ui by esbuild). -->
    <?!= include('ui'); ?>
  </body>
</html>
