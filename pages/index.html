<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>MyTube</title>
    <meta name="theme-color" content="#0f0f0f" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <!-- Installable wrapper for the Apps Script web app. Chrome installs a site
         only when the top page links a manifest, and Apps Script gives us no
         control over its own top page. So this page is the top page and frames
         the app. doGet must keep setXFrameOptionsMode(ALLOWALL), or Google
         refuses the frame. -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0f0f0f;
      }
      /* viewport-fit=cover draws this page under the notch and the home
         indicator, so pad the app back out of them. The padding must live
         here, on the top page: inside the app's iframes,
         env(safe-area-inset-*) reads 0. */
      body {
        box-sizing: border-box;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
          env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <!-- The allow list delegates what the player needs: fullscreen, autoplay
         for the next video, and the wake lock that keeps the screen on. -->
    <iframe
      id="app"
      title="MyTube"
      allow="
        autoplay;
        fullscreen;
        encrypted-media;
        picture-in-picture;
        screen-wake-lock;
        clipboard-write;
      "
    ></iframe>
    <script>
      // The app's state (screen, open video) lives in its URL params, but the
      // app can change only its own framed URL. So this page passes its own
      // params down on load (a reload or a shared link reopens the same
      // screen), and the app posts each new screen up here
      // (src/shared/wrapperUrl.ts). replaceState, never pushState: the
      // framed page already adds the back/forward entries.
      var APP_URL =
        "https://script.google.com/macros/s/AKfycbxKXGIgGhnj4jFBsx9KvMLQW9tRbVToQN2jfyZXrGRcWUynjrX6oWBnUDleJZlvT9E1/exec";
      document.getElementById("app").src = APP_URL + location.search;
      window.addEventListener("message", function (event) {
        // Apps Script serves the app from a *.googleusercontent.com sandbox.
        var host = event.origin.replace(/^https:\/\//, "");
        if (event.origin.indexOf("https://") !== 0) return;
        if (!/\.googleusercontent\.com$/.test(host)) return;
        var data = event.data;
        if (!data || data.type !== "mytube:url" || !data.params) return;
        var query = new URLSearchParams();
        Object.keys(data.params).forEach(function (key) {
          if (typeof data.params[key] === "string")
            query.set(key, data.params[key]);
        });
        var search = query.toString();
        history.replaceState(
          null,
          "",
          location.pathname + (search ? "?" + search : ""),
        );
      });
    </script>
  </body>
</html>
